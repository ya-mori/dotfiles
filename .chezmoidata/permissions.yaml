permissions:
  bash_allow:
    - "cd"
    - "ls"
    - "cat"
    - "find"
    - "grep"
    - "awk"
    - "sed"
    - "head"
    - "tail"
    - "wc"
    - "sort"
    - "echo"
    - "which"
    - "pwd"
    - "rg"
    - "make"
    - "mkdir"
    - "cp"
    - "chmod"
    - "uv run pytest"
    - "uv run mypy"
    - "uv run ruff"
    - "bq show"
    - "kubectl get"
    - "kubectl describe"
    - "kubectl logs"
    - "kubectl explain"
    - "kubectl top"
    - "kubectl version"
    - "kubectl cluster-info"
    - "kubectl api-resources"
    - "kubectl api-versions"
    - "kubectl config"
